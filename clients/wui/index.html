<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Backup and restore your Ledger Passwords nicknames" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Inter is bundled through src/index.css, not fetched from Google. Keep this page free of
         third-party origins: everything it needs is served next to it.
         'unsafe-inline' is required for styles and cannot be avoided here: base-ui renders
         inline <style> elements (SelectPopup, ScrollArea, TabsIndicator, SliderThumb) and React
         sets inline style attributes, and the nonce mechanism base-ui offers needs a per-response
         value, which static hosting on GitHub Pages cannot produce. The origin restriction still
         holds: no external stylesheet, script, font or connection can load.
         frame-ancestors is absent on purpose, a meta CSP cannot carry it; it would need an HTTP
         header, which GitHub Pages does not let us set. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Passwords Backup</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
