name: Password backup site generation & update

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/wui/
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node >= 22.5: pnpm 11 loads node:sqlite, which older Node lacks.
          node-version: '22'
      - name: Run install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          # pnpm is provisioned by corepack from the "packageManager" field.
          corepack enable
          # --frozen-lockfile: install exactly what pnpm-lock.yaml pins (fail on drift).
          pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        # path is relative to the repo root (not the job's working-directory).
        # dist/ already contains the CNAME file copied from public/CNAME, which
        # keeps the passwords.ledger.com custom domain.
        uses: actions/upload-pages-artifact@v5
        with:
          path: clients/wui/dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Build on PRs for validation, but only deploy on pushes / manual runs.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
