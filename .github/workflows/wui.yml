name: Password backup site generation & update

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/wui/
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node >= 22.5: pnpm 11 loads node:sqlite, which older Node lacks.
          node-version: '22'
      - name: Run install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          # pnpm is provisioned by corepack from the "packageManager" field.
          corepack enable
          # --frozen-lockfile: install exactly what pnpm-lock.yaml pins (fail on drift).
          pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build
      - name: Upload documentation bundle
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: clients/wui/dist/

  deploy:
    name: Deploy the site on GitHub pages
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: write
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Download documentation bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Deploy documentation on pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          cname: passwords.ledger.com
